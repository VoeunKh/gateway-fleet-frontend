services:
  fleetd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      FLEET_HTTP_ADDR: ":8080"
      FLEET_ENV: dev
      FLEET_DB: /data/fleet.db
    volumes:
      - fleet-data:/data
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

volumes:
  fleet-data:
